name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # npm packages: the download cache is keyed by package-lock.json; `npm ci` still installs exactly what the lockfile pins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax

      # Chromium: cached per exact Playwright version, so a new version always downloads its own browser.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (cache miss)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries (cache hit)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Test data is never cached: the tests read the fixtures in the repo and the network is replaced by them.
      # Vitest's coverage provider is optional; keep it out of the app's dependency lockfile.
      - name: Install Vitest coverage provider
        run: npm install --no-save --no-package-lock @vitest/coverage-v8@5.1.0
      - name: Unit tests with V8 coverage
        run: npm run test:unit -- --coverage
      - run: npm run test:ui
        env:
          CI: 'true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
