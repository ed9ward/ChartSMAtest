name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm packages: the download cache is keyed by package-lock.json; `npm ci` still installs exactly what the lockfile pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax

      # Chromium: cached per exact Playwright version, so a new version always downloads its own browser.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (cache miss)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Test data is never cached: the tests read the fixtures in the repo and the network is replaced by them.
      # Vitest's coverage provider is optional; keep it out of the app's dependency lockfile.
      - name: Install Vitest coverage provider
        run: npm install --no-save --no-package-lock @vitest/coverage-v8@5.1.0
      - name: Unit tests with V8 coverage
        run: npm run test:unit -- --coverage
      - run: npm run test:ui
        env:
          CI: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
