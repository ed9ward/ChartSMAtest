name: mutation

# Breaks the code in 93 places, one at a time, and checks that the tests notice each of them.
# It takes a while, so it runs once a week (and on request) instead of on every push.
# The push trigger below is restricted to the one explicitly named temporary run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  mutate:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'Run full mutation suite once')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run mutate
        env:
          CI: 'true'
