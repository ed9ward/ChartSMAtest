<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMA chart</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; color: #222; background: #fff; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    label { display: flex; gap: 6px; align-items: center; }
    [hidden] { display: none !important; }
    #day-change.up { color: #2e7d32; } #day-change.down { color: #c62828; }
    .axis-note { color: #666; font-size: 12px; margin: 2px 0; }
    .note { color: #8a5a00; background: #fff6e0; border: 1px solid #f0d9a0; padding: 4px 8px; margin: 4px 0; font-size: 13px; }
    input[type=number] { width: 70px; }
    .ind { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
    #settle-note div + div { margin-top: 4px; }
    #chart { width: 900px; max-width: 100%; height: 500px; border: 1px solid #ddd; }
    #legend span { margin-right: 16px; }
    #status.error { color: #c62828; }
  </style>
</head>
<body>
  <div class="row"><a href="checks.html" data-testid="open-checks">Run self-checks →</a></div>
  <div id="indicators" class="row" data-testid="indicators">
  <div class="ind" id="row-sma" data-testid="row-sma">
    <label><input type="checkbox" id="ind-sma" data-testid="ind-sma" checked><i class="swatch" style="background:#FF9800"></i><b>SMA</b></label>
    <label>Period <input id="period-sma" data-testid="period-sma" type="number" min="1" max="2000" step="1" value="20"></label>
    <label>Source <select id="source-sma" data-testid="source-sma"><option>close</option><option>open</option><option>high</option><option>low</option><option>volume</option><option>hl2</option><option>hlc3</option><option>ohlc4</option></select></label>
  </div>
  <div class="ind" id="row-ema" data-testid="row-ema">
    <label><input type="checkbox" id="ind-ema" data-testid="ind-ema"><i class="swatch" style="background:#2962FF"></i><b>EMA</b></label>
    <label>Period <input id="period-ema" data-testid="period-ema" type="number" min="1" max="2000" step="1" value="20"></label>
    <label>Source <select id="source-ema" data-testid="source-ema"><option>close</option><option>open</option><option>high</option><option>low</option><option>volume</option><option>hl2</option><option>hlc3</option><option>ohlc4</option></select></label>
    <label>Start <select id="ema-start" data-testid="ema-start">
      <option value="first">First value (TradingView)</option>
      <option value="sma">SMA of first N (TA-Lib)</option>
    </select></label>
  </div>
  <div class="ind" id="row-bb" data-testid="row-bb">
    <label><input type="checkbox" id="ind-bb" data-testid="ind-bb"><i class="swatch" style="background:#795548"></i><b>Bollinger Bands</b></label>
    <label>Period <input id="period-bb" data-testid="period-bb" type="number" min="1" max="2000" step="1" value="20"></label>
    <label>Source <select id="source-bb" data-testid="source-bb"><option>close</option><option>open</option><option>high</option><option>low</option><option>volume</option><option>hl2</option><option>hlc3</option><option>ohlc4</option></select></label>
    <label>Mult <input id="mult" data-testid="mult" type="number" step="0.5" value="2"></label>
  </div>
  <div class="ind" id="row-rsi" data-testid="row-rsi">
    <label><input type="checkbox" id="ind-rsi" data-testid="ind-rsi"><i class="swatch" style="background:#E91E63"></i><b>RSI</b></label>
    <label>Period <input id="period-rsi" data-testid="period-rsi" type="number" min="1" max="2000" step="1" value="14"></label>
    <label>Source <select id="source-rsi" data-testid="source-rsi"><option>close</option><option>open</option><option>high</option><option>low</option><option>volume</option><option>hl2</option><option>hlc3</option><option>ohlc4</option></select></label>
  </div>
  </div>
  <div class="row">
    <label>Data
      <select id="scenario" data-testid="scenario">
        <option value="binance">Binance live</option>
        <option value="coinbase">Coinbase live</option>
        <!-- synthetic data sets: only with ?demo (for tests and development) -->
        <option class="demo">normal</option><option class="demo">long</option><option class="demo">negative</option><option class="demo">huge</option><option class="demo">overflow</option><option class="demo">nan</option><option class="demo">inconsistent</option><option class="demo">flat</option><option class="demo">stalled</option><option class="demo">tiny</option><option class="demo">duplicates</option><option class="demo">unordered</option><option class="demo">empty</option>
      </select>
    </label>
    <label>Symbol
      <select id="symbol" data-testid="symbol">
        <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option>
      </select>
    </label>
    <label>Timeframe
      <select id="interval" data-testid="interval">
        <option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>1d</option>
      </select>
    </label>
    <button id="start" data-testid="start">Start stream</button>
    <button id="stop" data-testid="stop">Stop</button>
    <button id="disconnect" data-testid="disconnect">Disconnect feed</button>
    <button id="reconnect" data-testid="reconnect">Reconnect feed</button>
  </div>
  <div id="legend" class="row" data-testid="legend">
    <span>Bars: <b id="bar-count" data-testid="bar-count">0</b></span>
    <span>Close: <b id="last-close" data-testid="last-close">—</b></span>
    <span id="legend-day" hidden>Day: <b id="day-change" data-testid="day-change">—</b></span>
    <span>Updated: <b id="last-update" data-testid="last-update">—</b></span>
    <span id="legend-sma" data-testid="legend-sma"><span id="legend-label-sma" data-testid="legend-label-sma">SMA</span>: <b id="last-sma" data-testid="last-sma">—</b></span>
    <span id="legend-ema" data-testid="legend-ema" hidden><span id="legend-label-ema" data-testid="legend-label-ema">EMA</span>: <b id="last-ema" data-testid="last-ema">—</b></span>
    <span id="legend-bb" data-testid="legend-bb" hidden><span id="legend-label-bb" data-testid="legend-label-bb">BB</span>: <b id="last-bb-basis" data-testid="last-bb-basis">—</b> Upper: <b id="last-bb-upper" data-testid="last-bb-upper">—</b> Lower: <b id="last-bb-lower" data-testid="last-bb-lower">—</b></span>
    <span id="legend-rsi" data-testid="legend-rsi" hidden><span id="legend-label-rsi" data-testid="legend-label-rsi">RSI</span>: <b id="last-rsi" data-testid="last-rsi">—</b></span>
  </div>
  <div id="status" data-testid="status" role="status">OK</div>
  <div id="settle-note" data-testid="settle-note" class="note" hidden></div>
  <div class="axis-note" data-testid="axis-note">Time axis: UTC (the update time above is your local time)</div>
  <div id="chart" data-testid="chart"></div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
